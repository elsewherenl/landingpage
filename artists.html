        const cookieConsent = localStorage.getItem('cookieConsent');

<style>
    /* ================================================
       ARTISTS ROSTER — public.

       Reference: wonderingpeople.com/blogs/artists —
       two-image hover swap (work shot -> portrait) with
       the name accenting on hover. Re-implemented from
       scratch in our own markup/CSS and brand tokens.
       ================================================ */

    :root {
        --cream-bg: #F3EFE9;
        --deep-charcoal: #2C2C2C;
        --warm-gray: #8A8580;
        --text-muted: #6F6B67;
        --terracotta-text: #8D614E;
        --warm-off-white: #FDFCF8;
        --biscuit-gold: #D6B370;
        --khaki: #C0B589;
        --sage-green: #A8B5A0;
        --soft-terracotta: #C4A394;
        --page-top-desktop: 7.25rem;
        --page-top-mobile: 7rem;
        --page-top-small: 9rem;

        --artists-gutter-x: clamp(2.5rem, 6vw, 6rem);
        --artists-gutter-y: 6rem;
        --artists-ratio: 4 / 5;
        /* Viewport top to the tiles' top edge, plus the caption below them.
           Tiles are sized so image and name both fit on landing. */
        --artists-grid-top: 15.25rem;
        --artists-caption-h: 6rem;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'SuisseIntl', sans-serif;
        background: var(--cream-bg);
        color: var(--deep-charcoal);
        overflow-x: hidden;
        line-height: 1.6;
    }

    /* Header — matches about.html / spotlight.html */
    .header {
        position: fixed;
        top: 0;
        width: 100%;
        background: rgba(243, 239, 233, 0.92);
        backdrop-filter: blur(8px);
        z-index: 1000;
        padding: 1.5rem 0;
    }

    .header-container {
        max-width: 1600px;
        margin: 0 auto;
        padding: 0 3rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-family: 'SuisseIntl', sans-serif;
        font-size: 2.2rem;
        font-weight: 500;
        color: var(--deep-charcoal);
        text-decoration: none;
        letter-spacing: 0.06em;
        text-transform: lowercase;
        cursor: pointer;
        transition: opacity 0.3s ease;
    }

    .nav-menu {
        display: flex;
        gap: 3rem;
        list-style: none;
    }

    .nav-menu a {
        text-decoration: none;
        white-space: nowrap;
        color: rgba(44, 44, 44, 0.75);
        font-weight: 300;
        font-size: 1.05rem;
        letter-spacing: 0.04em;
        transition: opacity 0.3s ease, color 0.3s ease;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
        color: var(--deep-charcoal);
    }

    /* Hero */
    .artists-hero {
        max-width: 1600px;
        margin: 0 auto;
        padding: var(--page-top-desktop) 3rem 2rem;
    }

    .artists-hero .eyebrow {
        display: block;
        font-size: 0.85rem;
        font-weight: 300;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--terracotta-text);
        margin-bottom: 1rem;
    }

    .artists-hero h1 {
        font-family: 'SuisseIntl', sans-serif;
        font-weight: 300;
        font-size: 2.1rem;
        line-height: 1.2;
        letter-spacing: -0.02em;
        margin: 0 0 1.5rem;
        color: var(--deep-charcoal);
        max-width: 16ch;
    }

    @media (min-width: 1280px) {
        .artists-hero h1 {
            font-size: 2.2rem;
            line-height: 1.25;
            letter-spacing: -0.015em;
        }
    }

    .artists-hero p {
        font-size: 1rem;
        font-weight: 300;
        color: var(--text-muted);
        max-width: 760px; /* same text measure as the homepage hero and Spotlights intro */
    }

    /* Grid — same outer box model as .artists-hero (max-width/margin/side
       padding) so the two never drift apart; .ec-grid narrows only the
       columns themselves, from the same fixed left edge. */
    .artists-grid {
        max-width: 1600px;
        margin: 0 auto;
        padding: 0 3rem 8rem;
    }

    /* Tiles take the smallest of: 520px, a third of the row (so all three
       artists sit on one row, phones included), and the height left under the hero
       (so each name lands above the fold). The 240px floor stops them
       shrinking to nothing on very short landscape windows. */
    .ec-grid {
        --tile-w: min(
            520px,
            calc((100% - 2 * var(--artists-gutter-x)) / 3 - 1px),
            max(240px, calc((100svh - var(--artists-grid-top) - var(--artists-caption-h)) * 0.8))
        );
        max-width: 1600px;
        margin: 0;
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fill, var(--tile-w));
        column-gap: var(--artists-gutter-x);
        row-gap: var(--artists-gutter-y);
    }

    /* Browsers without svh units (pre-2022) would otherwise drop --tile-w
       entirely and fall back to one full-width column. */
    @supports not (height: 100svh) {
        .ec-grid {
            --tile-w: min(
                520px,
                calc((100% - 2 * var(--artists-gutter-x)) / 3 - 1px),
                max(240px, calc((100vh - var(--artists-grid-top) - var(--artists-caption-h)) * 0.8))
            );
        }
    }

    .artist-tile a {
        display: block;
        text-decoration: none;
        color: inherit;
    }

    .artist-tile a:focus-visible {
        outline: 2px solid var(--deep-charcoal);
        outline-offset: 6px;
    }

    .artist-tile .thumb-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: var(--artists-ratio);
        overflow: hidden;
        background: var(--warm-gray);
    }

    .artist-tile .thumb-wrapper img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .artist-tile .artist-caption {
        margin-top: 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
    }

    .artist-tile .artist-name {
        display: block;
        font-size: 1.4rem;
        font-weight: 300;
        letter-spacing: -0.005em;
        color: var(--deep-charcoal);
        transition: color 0.3s ease;
    }

    .artist-tile .artist-role {
        display: block;
        font-size: 0.85rem;
        font-weight: 300;
        letter-spacing: 0.04em;
        color: var(--text-muted);
        white-space: nowrap;
    }

    .artist-tile a:hover .artist-name,
    .artist-tile a:focus-visible .artist-name {
        color: var(--terracotta-text);
    }

    @media (max-width: 700px) {
        :root {
            --artists-gutter-x: 1rem;
            --artists-gutter-y: 2.75rem;
            --artists-grid-top: 15rem;
            --artists-caption-h: 4rem;
        }

        .header {
            padding: 1rem 0;
        }

        .header-container {
            padding: 0 1.5rem;
        }

        .logo {
            font-size: 1.3rem;
            letter-spacing: 0.02em;
        }

        .nav-menu {
            gap: 1.1rem;
        }

        .nav-menu a {
            font-size: 0.85rem;
            letter-spacing: 0.01em;
        }

        .artists-hero {
            padding: var(--page-top-mobile) 1.5rem 1.5rem;
        }

        .artists-grid {
            padding: 0 1.5rem 5rem;
        }

        .artist-tile .artist-caption {
            margin-top: 0.75rem;
        }

        .artist-tile .artist-name {
            font-size: 1.05rem;
            line-height: 1.35;
        }
    }

    @media (max-width: 480px) {
        .header-container {
            padding: 0 1.5rem;
        }

        .logo {
            font-size: 1.2rem;
        }

        .nav-menu {
            gap: 0.5rem;
        }

        .nav-menu a {
            font-size: 0.8rem;
        }
    }

        /* Custom cursor: terracotta red circle that grows smoothly over
           interactive elements. Rendered as a DOM dot (not a native cursor
           image) since native cursors can't be transitioned. */
        body {
            cursor: none;
        }

        *, *::before, *::after {
            cursor: none !important;
        }

        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 100000;
            margin: -10px 0 0 -10px;
            transform: translate3d(-100px, -100px, 0);
            will-change: transform;
        }

        /* Grow is on a pseudo-element so the scale transition never
           delays the dot's position, which tracks the pointer 1:1. */
        .cursor-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: #95392E;
            transition: transform 0.18s ease;
        }

        .cursor-dot.is-hovering::after {
            transform: scale(1.35);
        }

        @media (hover: none), (pointer: coarse) {
            body, *, *::before, *::after {
                cursor: auto !important;
            }

            .cursor-dot {
                display: none;
            }
        }

        /* Fallback cookie banner (shown only if Silktide fails to load) */
        .cookie-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--deep-charcoal);
            color: var(--warm-off-white);
            padding: 1rem 2rem;
            z-index: 10000;
            opacity: 0;
            transform: translateY(100%);
            transition: all 0.4s ease;
            display: none;
        }

        .cookie-banner.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .cookie-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
        }

        .cookie-text {
            font-size: 0.9rem;
            font-weight: 300;
            color: var(--warm-off-white);
            line-height: 1.4;
        }

        .cookie-link {
            color: var(--khaki);
            text-decoration: none;
            border-bottom: 1px solid var(--khaki);
            margin-left: 0.5rem;
            transition: all 0.3s ease;
        }

        .cookie-link:hover {
            color: var(--warm-off-white);
            border-bottom-color: var(--warm-off-white);
        }

        .cookie-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }

        .cookie-button {
            background: var(--khaki);
            color: var(--deep-charcoal);
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 2px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .cookie-button:hover {
            opacity: 0.85;
        }

        .essential-link {
            font-size: 0.85rem;
            color: rgba(253, 252, 248, 0.7);
            cursor: pointer;
            text-decoration: underline;
        }

        .essential-link:hover {
            color: var(--warm-off-white);
        }

        @media (max-width: 768px) {
            .cookie-banner {
                padding: 1rem;
            }

            .cookie-content {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }

    /* Smallest phones (≤350px): keep logo and "Artists & Works" nav on one line */
    @media (max-width: 350px) {
        .logo { font-size: 1.05rem; }
        .header-container { gap: 0.75rem; }
        .nav-menu { gap: 0.6rem; }
        .nav-menu a { font-size: 0.72rem; }
    }
</style>

    <script>
        // Custom cursor dot: follows the pointer and grows smoothly over
        // interactive elements. Skipped entirely on touch/coarse-pointer
        // devices via the (hover: none) media query above.
        (function() {
            const dot = document.getElementById('cursorDot');
            if (!dot || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

            // Position via a GPU-composited transform. The dot eases toward
            // the pointer (covering ~60% of the gap per 60Hz frame, scaled so
            // 120Hz displays feel the same) and the loop idles once it lands.
            const EASE = 0.6;
            let tx = 0, ty = 0, x = 0, y = 0, last = 0, running = false, seen = false;
            function tick(now) {
                const t = 1 - Math.pow(1 - EASE, Math.min(now - last, 64) / (1000 / 60));
                last = now;
                x += (tx - x) * t;
                y += (ty - y) * t;
                if (Math.abs(tx - x) < 0.1 && Math.abs(ty - y) < 0.1) {
                    x = tx;
                    y = ty;
                    running = false;
                } else {
                    requestAnimationFrame(tick);
                }
                dot.style.transform = `translate3d(${x}px, ${y}px, 0)`;
            }
            window.addEventListener('mousemove', (e) => {
                tx = e.clientX;
                ty = e.clientY;
                if (!seen) {
                    // Snap on first move rather than gliding in from off-screen.
                    seen = true;
                    x = tx;
                    y = ty;
                }
                if (running) return;
                running = true;
                last = performance.now();
                requestAnimationFrame(tick);
            }, { passive: true });

            document.addEventListener('mouseover', (e) => {
                const interactive = e.target.closest('a, button, [role="button"], input, textarea, select, label[for], summary');
                dot.classList.toggle('is-hovering', !!interactive);
            });
        })();
    </script>
</body>
</html>
