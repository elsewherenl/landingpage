<!-- Cookie Banner Configuration -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof silktideCookieBannerManager !== 'undefined') {
        silktideCookieBannerManager.updateCookieBannerConfig({
            background: {
                showBackground: true
            },
            cookieIcon: {
                position: "bottomRight"
            },
            cookieTypes: [
                {
                    id: "necessary",
                    name: "Necessary",
                    description: "<p>These cookies are necessary for the website to function properly and cannot be switched off. They help with things like logging in and setting your privacy preferences.</p>",
                    required: true,
                    onAccept: function() {}
                },
                {
                    id: "analytics",
                    name: "Analytics",
                    description: "<p>These cookies help us improve the site by tracking which pages are most popular and how visitors move around the site.</p>",
                    required: false,
                    onAccept: function() {
                        localStorage.setItem('analyticsConsent', 'true');
                        if (typeof gtag !== 'undefined') {
                            gtag('consent', 'update', {
                                analytics_storage: 'granted',
                            });
                            dataLayer.push({
                                'event': 'consent_accepted_analytics',
                            });
                        }
                        loadAnalytics();
                    },
                    onReject: function() {
                        localStorage.setItem('analyticsConsent', 'false');
                        if (typeof gtag !== 'undefined') {
                            gtag('consent', 'update', {
                                analytics_storage: 'denied',
                            });
                        }
                    }
                }
            ],
            text: {
                banner: {
                    description: "<p>We use cookies to analyse site usage and improve your experience. <a href=\"https://elsewherecollective.nl/cookie-policy\" target=\"_blank\">Cookie Policy.</a></p>",
                    acceptAllButtonText: "OK",
                    acceptAllButtonAccessibleLabel: "Accept all cookies",
                    rejectNonEssentialButtonText: "Essential Only",
                    rejectNonEssentialButtonAccessibleLabel: "Essential cookies only",
                    preferencesButtonText: "Settings",
                    preferencesButtonAccessibleLabel: "Cookie preferences"
                },
                preferences: {
                    title: "Cookie Settings",
                    description: "<p>Choose which cookies you'd like to enable. Essential cookies are required for the site to function and cannot be disabled.</p>",
                    creditLinkText: "",
                    creditLinkAccessibleLabel: ""
                }
            },
            position: {
                banner: "bottomRight"
            }
        });
    } else {
        initCustomCookieBanner();
    }

    function loadAnalytics() {
        if (!window.dataLayer) {
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-NZVK7P7J3D');

            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=G-NZVK7P7J3D';
            document.head.appendChild(script);
        }
    }

    function initCustomCookieBanner() {
        const cookieConsent = localStorage.getItem('cookieConsent');

        if (!cookieConsent) {
            const banner = document.createElement('div');
            banner.className = 'cookie-banner show';
            banner.innerHTML = `
                <div class="cookie-content">
                    <div class="cookie-text">
                        We use cookies to analyse site usage and improve your experience.
                        <a href="https://elsewherecollective.nl/cookie-policy" target="_blank" class="cookie-link">Cookie Policy</a>
                    </div>
                    <div class="cookie-actions">
                        <button class="cookie-button" id="acceptCookies">Accept All</button>
                        <span class="essential-link" id="essentialOnly">Essential Only</span>
                    </div>
                </div>
            `;
            document.body.appendChild(banner);

            document.getElementById('acceptCookies').onclick = function() {
                localStorage.setItem('cookieConsent', 'accepted');
                localStorage.setItem('analyticsConsent', 'true');
                banner.remove();
                loadAnalytics();
            };

            document.getElementById('essentialOnly').onclick = function() {
                localStorage.setItem('cookieConsent', 'essential');
                localStorage.setItem('analyticsConsent', 'false');
                banner.remove();
            };
        } else if (cookieConsent === 'accepted') {
            loadAnalytics();
        }
    }
});
</script>

<style>
    /* ================================================
       ARTISTS ROSTER — public.

       Reference: wonderingpeople.com/blogs/artists —
       two-image hover swap (work shot -> portrait) with
       the name accenting on hover. Re-implemented from

       ================================================ */

    :root {

        --deep-charcoal: #2C2C2C;

        --warm-off-white: #FDFCF8;

        --artists-ratio: 4 / 5;
    }

    * {

        padding: 0;
        box-sizing: border-box;
    }

    body {

    /* Header — matches about.html / spotlight.html */

        position: fixed;
        top: 0;

        backdrop-filter: blur(8px);
        z-index: 1000;
        padding: 1.5rem 0;

    .header-container {

        color: var(--warm-gray);

    /* Grid — same outer box model as .artists-hero (max-width/margin/side

       columns themselves, from the same fixed left edge. */
    .artists-grid {
        max-width: 1600px;
        margin: 0 auto;
        padding: 1rem 3rem 8rem;
    }

    .ec-grid {

        /* Custom cursor: terracotta red circle that grows smoothly over
           interactive elements. Rendered as a DOM dot (not a native cursor
           image) since native cursors can't be transitioned. */
        body {
            cursor: none;
        }

        *, *::before, *::after {
            cursor: none !important;
        }

        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 100000;
            margin: -10px 0 0 -10px;
            transform: translate3d(-100px, -100px, 0);
            will-change: transform;
        }

        /* Grow is on a pseudo-element so the scale transition never
           delays the dot's position, which tracks the pointer 1:1. */
        .cursor-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: #95392E;
            transition: transform 0.18s ease;
        }

        .cursor-dot.is-hovering::after {
            transform: scale(1.35);
        }

        @media (hover: none), (pointer: coarse) {
            body, *, *::before, *::after {
                cursor: auto !important;
            }

            .cursor-dot {
                display: none;
            }
        }

        /* Fallback cookie banner (shown only if Silktide fails to load) */
        .cookie-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--deep-charcoal);
            color: var(--warm-off-white);
            padding: 1rem 2rem;
            z-index: 10000;
            opacity: 0;
            transform: translateY(100%);
            transition: all 0.4s ease;
            display: none;
        }

        .cookie-banner.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .cookie-content {

            display: flex;

            }

            .cookie-content {
                flex-direction: column;
                gap: 1rem;
                text-align: center;

</style>

    <script>
        // Custom cursor dot: follows the pointer and grows smoothly over
        // interactive elements. Skipped entirely on touch/coarse-pointer
        // devices via the (hover: none) media query above.
        (function() {
            const dot = document.getElementById('cursorDot');
            if (!dot || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

            // Position via a GPU-composited transform. The dot eases toward
            // the pointer (covering ~60% of the gap per 60Hz frame, scaled so
            // 120Hz displays feel the same) and the loop idles once it lands.
            const EASE = 0.6;
            let tx = 0, ty = 0, x = 0, y = 0, last = 0, running = false, seen = false;
            function tick(now) {
                const t = 1 - Math.pow(1 - EASE, Math.min(now - last, 64) / (1000 / 60));
                last = now;
                x += (tx - x) * t;
                y += (ty - y) * t;
                if (Math.abs(tx - x) < 0.1 && Math.abs(ty - y) < 0.1) {
                    x = tx;
                    y = ty;
                    running = false;
                } else {
                    requestAnimationFrame(tick);
                }
                dot.style.transform = `translate3d(${x}px, ${y}px, 0)`;
            }
            window.addEventListener('mousemove', (e) => {
                tx = e.clientX;
                ty = e.clientY;
                if (!seen) {
                    // Snap on first move rather than gliding in from off-screen.
                    seen = true;
                    x = tx;
                    y = ty;
                }
                if (running) return;
                running = true;
                last = performance.now();
                requestAnimationFrame(tick);
            }, { passive: true });

            document.addEventListener('mouseover', (e) => {
                const interactive = e.target.closest('a, button, [role="button"], input, textarea, select, label[for], summary');
                dot.classList.toggle('is-hovering', !!interactive);
            });
        })();
    </script>
