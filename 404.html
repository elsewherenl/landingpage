<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // GitHub Pages clean URL handler for static HTML pages.
        (function() {
            const path = window.location.pathname;
            const cleanPath = path.replace(/\/$/, "");
            const fallbackPath = "/home";
            const spotlightPath = "/spotlight";

            // Map clean URLs to physical files. Most clean URLs (/about, /spotlight,
            // /cookie-policy, /artists, /mitsutaka, /jesula) now resolve directly via
            // GitHub Pages' extensionless-file fallback since the filenames match —
            // this table is only needed for paths GitHub Pages can't resolve itself.
            const routes = {
                "/home": "/index.html"
            };

            if (cleanPath === "/spotlights") {
                window.location.replace(spotlightPath);
                return;
            }

            if (cleanPath === "" || cleanPath === "/") {
                window.location.replace(fallbackPath);
                return;
            }

            const targetFile = routes[cleanPath];
            if (!targetFile) {
                window.location.replace(fallbackPath);
                return;
            }

            fetch(encodeURI(targetFile))
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error("Route target not found");
                    }
                    return response.text();
                })
                .then(function(html) {
                    document.open();
                    document.write(html);
                    document.close();
                    history.replaceState(null, "", cleanPath);
                })
                .catch(function() {
                    window.location.replace(fallbackPath);
                });
        })();
    </script>
</head>
<body>
    <p>Loading...</p>
</body>
</html>
